# Render Blueprint — America Ships On Click
#
# The app is an Express server (dist/server.cjs) that also serves the built
# SPA, so deep links like /loads and the /api routes come from one process.
# Static hosting cannot run it.
#
# PostgreSQL is hosted on Neon, not Render, so this Blueprint creates only the
# web service. Both connection strings are pasted in from the Neon console.
#
# Two database roles, matching database/scripts/postgres-dev.sh:
#   DATABASE_ADMIN_URL  owner (neondb_owner) — migrations only
#   DATABASE_URL        asoc_app — runtime, subject to Row-Level Security
#
# RLS is enabled but NOT forced (pg_class.relforcerowsecurity = false), so the
# owner role bypasses every policy. Pointing DATABASE_URL at the owner would
# silently void the security model. See docs/DEPLOY.md step 1 before deploying.

services:
  - type: web
    name: america-ships-on-click
    runtime: node
    # Free instances spin down after 15 minutes without traffic; the first
    # request after that waits for a cold start.
    plan: free
    # Keep this next to the Neon project's region (AWS US East 2, Ohio).
    region: ohio
    # Vite and esbuild are production dependencies so this build works even
    # when NODE_ENV=production skips devDependencies.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Owner connection: used only to run migrations at boot, under a
      # pg_advisory_xact_lock so a rolling deploy migrates exactly once.
      # Set to the Neon connection string for neondb_owner.
      - key: DATABASE_ADMIN_URL
        sync: false

      # Runtime connection as the least-privilege asoc_app role.
      # Set after creating the role as described in docs/DEPLOY.md.
      - key: DATABASE_URL
        sync: false

      # Behind Render's load balancer. Without this the rate limiter records
      # the proxy's address, not the client's.
      - key: TRUST_PROXY
        value: "true"

      # Generated once at creation and persisted across deploys. Rotating
      # JWT_SECRET invalidates every issued token.
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_TOKEN_SECRET
        generateValue: true

      - key: ADMIN_EMAIL
        value: admin@americashipsonclick.com
      # Set in the Render dashboard. Must be 8+ chars and not the demo password;
      # the server refuses to start otherwise.
      - key: ADMIN_PASSWORD
        sync: false

      # Optional. Set in the Render dashboard to turn on Continue with Google;
      # the button stays hidden until then. See the README for creating the id.
      - key: GOOGLE_CLIENT_ID
        sync: false

      # Demo seeding stays off in production.
      - key: DB_SEED
        value: "false"
